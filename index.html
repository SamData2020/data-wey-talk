<!doctype html>
<html lang="pcm">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Wey Talk · Scitylana</title>
  <meta name="description" content="Free data analytics wey dey talk Pidgin — a Scitylana Academy CSR initiative. Learn data analytics and see wetin your business numbers dey talk.">
  <meta name="theme-color" content="#760308">
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar-wrap">
    <div class="topbar">
      <a class="brand" href="./" aria-label="Data Wey Talk by Scitylana — home">
        <img src="assets/scitylana-mark.jpg" alt="" width="40" height="40">
        <span class="brand-text">
          <span class="brand-name">Data Wey Talk</span>
          <span class="brand-by">by Scitylana</span>
        </span>
      </a>
      <label class="lang">
        <span class="globe" aria-hidden="true">🌐</span>
        <select id="langSel" aria-label="Language · Langue · اللغة">
          <option value="pcm">Pidgin</option>
          <option value="en">English</option>
          <option value="fr" lang="fr">Français</option>
          <option value="sw" lang="sw">Kiswahili</option>
          <option value="ar" lang="ar">العربية</option>
          <option value="ha" lang="ha">Hausa</option>
          <option value="yo" lang="yo">Yorùbá</option>
          <option value="ig" lang="ig">Igbo</option>
          <option value="zu" lang="zu">isiZulu</option>
        </select>
      </label>
    </div>
    <nav class="subnav" aria-label="Sections">
      <a href="#start" data-i18n="navTool"></a>
      <a href="#learn" data-i18n="navLessons"></a>
      <a href="#curriculum" data-i18n="navCurriculum"></a>
      <a href="#quiz" data-i18n="navQuiz"></a>
      <a href="#about" data-i18n="navAbout"></a>
    </nav>
  </header>

  <!-- Hero -->
  <section class="hero-band">
    <div class="hero">
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="heroTitle"></h1>
      <p class="lede" data-i18n="heroLede"></p>
    </div>
  </section>

  <main>
    <section class="upload" id="start">
      <!-- Step 1: survey -->
      <form id="survey" class="survey" novalidate>
        <h2 data-i18n="svTitle"></h2>
        <p class="muted" data-i18n="svLede"></p>

        <fieldset>
          <legend data-i18n="svGoals"></legend>
          <label class="check"><input type="checkbox" name="goal_business"><span data-i18n="svGoalBusiness"></span></label>
          <label class="check"><input type="checkbox" name="goal_analyst"><span data-i18n="svGoalAnalyst"></span></label>
          <label class="check"><input type="checkbox" name="goal_learn"><span data-i18n="svGoalLearn"></span></label>
          <label class="check"><input type="checkbox" name="goal_help"><span data-i18n="svGoalHelp"></span></label>
        </fieldset>

        <div class="follow" id="svBizBlock" hidden>
          <label class="field"><span data-i18n="svBizType"></span>
            <select id="svBizType">
              <option value="" data-i18n="svPick"></option>
              <option value="food" data-i18n="bt_food"></option>
              <option value="retail" data-i18n="bt_retail"></option>
              <option value="fashion" data-i18n="bt_fashion"></option>
              <option value="beauty" data-i18n="bt_beauty"></option>
              <option value="agro" data-i18n="bt_agro"></option>
              <option value="transport" data-i18n="bt_transport"></option>
              <option value="pos" data-i18n="bt_pos"></option>
              <option value="electronics" data-i18n="bt_electronics"></option>
              <option value="services" data-i18n="bt_services"></option>
              <option value="other" data-i18n="bt_other"></option>
            </select>
          </label>
          <label class="field"><span data-i18n="svBizSize"></span>
            <select id="svBizSize">
              <option value="" data-i18n="svPick"></option>
              <option value="1" data-i18n="bs_1"></option>
              <option value="2-5" data-i18n="bs_2"></option>
              <option value="6-20" data-i18n="bs_6"></option>
              <option value="20+" data-i18n="bs_20"></option>
            </select>
          </label>
        </div>

        <div class="follow" id="svLevelBlock" hidden>
          <label class="field"><span data-i18n="svLevel"></span>
            <select id="svLevel">
              <option value="" data-i18n="svPick"></option>
              <option value="beginner" data-i18n="lv_new"></option>
              <option value="some-excel" data-i18n="lv_some"></option>
              <option value="working" data-i18n="lv_work"></option>
            </select>
          </label>
        </div>

        <div class="grid2">
          <label class="field"><span data-i18n="svName"></span>
            <input id="svName" type="text" autocomplete="name" maxlength="100"></label>
          <label class="field"><span><span data-i18n="svEmail"></span> *</span>
            <input id="svEmail" type="email" autocomplete="email" inputmode="email" maxlength="120" required></label>
          <label class="field"><span><span data-i18n="svCountry"></span> *</span>
            <select id="svCountry" autocomplete="country-name" required></select></label>
          <label class="field"><span><span data-i18n="svCity"></span> *</span>
            <input id="svCity" type="text" autocomplete="address-level2" maxlength="80" required></label>
          <label class="field wide"><span><span data-i18n="svPhone"></span> *</span>
            <input id="svPhone" type="tel" autocomplete="tel" inputmode="tel" maxlength="24" placeholder="+234 803 123 4567" required></label>
        </div>

        <!-- Honeypot: hidden from people, bots fill it -->
        <label class="hp" aria-hidden="true">Website <input name="website" tabindex="-1" autocomplete="off"></label>

        <label class="check consent"><input type="checkbox" name="consent"><span data-i18n="svConsent"></span></label>

        <p class="error" id="svError" role="alert" hidden></p>
        <button type="submit" class="btn" id="svSubmit" data-i18n="svSubmit"></button>
        <p class="privacy muted" data-i18n="svPrivacy"></p>
        <p class="privacy muted"><span data-i18n="svDelete"></span> <a class="mail" href="mailto:scitylanaltd@gmail.com?subject=Data%20Wey%20Talk%20-%20delete%20my%20details">scitylanaltd@gmail.com</a></p>
      </form>

      <!-- Step 2: the tool -->
      <div id="tool" hidden>
        <p class="thanks" id="svThanks" hidden></p>
        <label class="drop" id="drop" for="file">
          <input type="file" id="file" accept=".csv,text/csv,.txt">
          <span class="drop-icon" aria-hidden="true">⬆️</span>
          <strong data-i18n="dropTitle"></strong>
          <span class="muted" data-i18n="dropHint"></span>
        </label>
        <div class="hero-actions">
          <button type="button" class="btn" id="sample" data-i18n="trySample"></button>
        </div>
        <p class="download">
          <a href="data/akara-and-bread-sales.csv" download data-i18n="download"></a><br>
          <span class="muted small" data-i18n="downloadHint"></span>
        </p>
        <p class="privacy muted" data-i18n="privacy"></p>
        <p class="error" id="error" role="alert" hidden></p>
      </div>
    </section>

    <!-- Results -->
    <section id="results" hidden>
      <div class="file-bar">
        <div>
          <h2 id="fileName"></h2>
          <p class="muted" id="fileShape"></p>
        </div>
        <button type="button" class="btn ghost" id="reset" data-i18n="newFile"></button>
      </div>

      <div class="controls">
        <label>
          <span data-i18n="pickNumber"></span>
          <select id="numCol"></select>
        </label>
        <label>
          <span data-i18n="pickGroup"></span>
          <select id="groupCol"></select>
        </label>
      </div>

      <h3 class="section-title" data-i18n="glance"></h3>
      <div class="tiles" id="tiles"></div>

      <h3 class="section-title" data-i18n="talking"></h3>
      <ul class="insights" id="insights"></ul>

      <div class="card" id="barCard">
        <h3 id="barTitle"></h3>
        <p class="muted small" data-i18n="barHint"></p>
        <div class="bars" id="bars"></div>
      </div>

      <div class="card" id="lineCard" hidden>
        <h3 id="lineTitle"></h3>
        <p class="muted small" data-i18n="lineHint"></p>
        <div class="line-wrap" id="lineWrap">
          <div class="tooltip" id="tip" hidden></div>
        </div>
      </div>

      <div class="card" id="corrCard" hidden>
        <h3 data-i18n="corrTitle"></h3>
        <p class="muted small" data-i18n="corrLede"></p>
        <p class="muted small" id="corrPick" data-i18n="corrPick"></p>
        <div class="corr-list" id="corrList"></div>
        <div class="scatter-wrap line-wrap" id="scatterWrap"></div>
        <p class="caution small" data-i18n="corrCaution"></p>
      </div>

      <details class="card table-card">
        <summary data-i18n="seeTable"></summary>
        <div class="table-scroll"><table id="table"></table></div>
        <p class="muted small" id="tableNote"></p>
      </details>

      <div class="help-cta">
        <div>
          <h3 data-i18n="helpTitle"></h3>
          <p data-i18n="helpBody"></p>
        </div>
        <a class="btn gold" id="helpBtn" href="mailto:scitylanaltd@gmail.com" data-i18n="helpBtn"></a>
        <p class="small help-note" data-i18n="helpNote"></p>
      </div>
    </section>

    <!-- Quick lessons -->
    <section class="learn" id="learn">
      <p class="eyebrow dark" data-i18n="learnEyebrow"></p>
      <h2 data-i18n="learnTitle"></h2>
      <p class="muted" data-i18n="learnLede"></p>
      <div class="lessons">
        <article class="lesson"><span class="num">1</span><h3 data-i18n="l1t"></h3><p data-i18n="l1b"></p></article>
        <article class="lesson"><span class="num">2</span><h3 data-i18n="l2t"></h3><p data-i18n="l2b"></p></article>
        <article class="lesson"><span class="num">3</span><h3 data-i18n="l3t"></h3><p data-i18n="l3b"></p></article>
        <article class="lesson"><span class="num">4</span><h3 data-i18n="l4t"></h3><p data-i18n="l4b"></p></article>
        <article class="lesson"><span class="num">5</span><h3 data-i18n="l5t"></h3><p data-i18n="l5b"></p></article>
        <article class="lesson"><span class="num">6</span><h3 data-i18n="l6t"></h3><p data-i18n="l6b"></p></article>
      </div>
    </section>

    <!-- Curriculum -->
    <section class="curriculum" id="curriculum">
      <p class="eyebrow dark" data-i18n="curEyebrow"></p>
      <h2 data-i18n="curTitle"></h2>
      <p class="muted" data-i18n="curLede"></p>
      <div class="modules" id="modules"></div>

      <h3 class="sub-title" data-i18n="secTitle"></h3>
      <p class="muted" data-i18n="secLede"></p>
      <div class="sectors" id="sectors"></div>

      <p class="cta-row"><a class="btn" href="#start" data-i18n="curCta"></a></p>
    </section>

    <!-- Quiz -->
    <section class="quiz" id="quiz">
      <div class="quiz-head">
        <p class="eyebrow" data-i18n="qzEyebrow"></p>
        <h2 id="qzTitle"></h2>
        <p id="qzLede"></p>
      </div>
      <div class="quiz-box" id="quizBox" aria-live="polite"></div>
      <details class="quiz-rules">
        <summary id="qzRulesTitle"></summary>
        <ol id="qzRules"></ol>
      </details>
    </section>

    <!-- CSR -->
    <section class="csr" id="about">
      <img class="csr-logo" src="assets/scitylana-logo.jpg" alt="Scitylana — Remodeling the Future" width="160" height="160">
      <div>
        <p class="eyebrow" data-i18n="csrEyebrow"></p>
        <h2 data-i18n="csrTitle"></h2>
        <p data-i18n="csrBody"></p>
        <ul class="pills">
          <li data-i18n="pill1"></li>
          <li data-i18n="pill2"></li>
          <li data-i18n="pill3"></li>
        </ul>
      </div>
    </section>
  </main>

  <footer>
    <img src="assets/scitylana-mark.jpg" alt="" width="28" height="28">
    <span><span data-i18n="footer"></span> · <a class="mail" href="mailto:scitylanaltd@gmail.com">scitylanaltd@gmail.com</a></span>
  </footer>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="survey.js"></script>
  <script src="quiz.js"></script>
  <script src="correlate.js"></script>
  <script src="curriculum.js"></script>
  <!-- Languages: one file each; a missing word falls back to English -->
  <script src="lang/sw.js"></script>
  <script src="lang/fr.js"></script>
  <script src="lang/ar.js"></script>
  <script src="lang/ha.js"></script>
  <script src="lang/yo.js"></script>
  <script src="lang/ig.js"></script>
  <script src="lang/zu.js"></script>
  <script>applyLang();</script>
</body>
</html>
